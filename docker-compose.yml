version: '3.8'

services:
  backend:
    build: 
      context: ./f1-dashboard
      dockerfile: Dockerfile
    ports:
      - "8080:8080"
    environment:
      - SPRING_PROFILES_ACTIVE=prod
      # Set F1_API_KEY to your RapidAPI key for the F1 Motorsport Data API.
      # Never hard-code a real value here; pass it via an .env file or your secrets manager.
      - F1_API_KEY=${F1_API_KEY}

  frontend:
    build:
      context: ./frontend-f1-dashboard
      dockerfile: Dockerfile
    ports:
      - "3000:3000"
    depends_on:
      - backend
    environment:
      - NEXT_PUBLIC_API_URL=http://backend:8080
